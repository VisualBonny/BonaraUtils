<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BonnyUtilsPhone</title>
<meta name="theme-color" content="#ffd700">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BonnyUtilsPhone">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: #fff8dc; color: #222; font: 17px/1.4 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
  body { padding: env(safe-area-inset-top) 0 0; min-height: 100vh; display: flex; flex-direction: column; }
  header { padding: 14px 16px 4px; }
  header h1 { margin: 0; font-size: 22px; }
  header p { margin: 2px 0 0; color: #666; font-size: 15px; }
  main { flex: 1; padding: 0 16px 16px; }
  label { display: block; font-weight: 700; margin: 14px 0 6px; }
  input, textarea { width: 100%; padding: 12px; font-size: 19px; border: 1px solid #aaa; border-radius: 10px; background: #fff; color: #222; font-family: inherit; }
  input:focus, textarea:focus { outline: 2px solid #d4a017; border-color: #d4a017; }
  .riga { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .sezione { display: flex; justify-content: space-between; align-items: baseline; margin: 18px 0 8px; }
  .sezione label { margin: 0; }
  .sezione span { color: #666; font-size: 15px; }
  .rigat { background: #fff; border: 1px solid #ddd; border-radius: 14px; padding: 10px; margin-bottom: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.06); position: relative; }
  .rigat.nuova { animation: entra .18s ease-out; }
  @keyframes entra { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  .rigat.errore { border-color: #e08080; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding-right: 34px; }
  .chips button { min-width: 44px; padding: 9px 10px; font-size: 15px; border-radius: 20px; border: 1px solid #bbb; background: #f2f2f2; color: #222; }
  .chips button.on { background: #ffd700; border-color: #c9a800; font-weight: 700; }
  .chips button:disabled { opacity: .35; text-decoration: line-through; }
  .del { position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border-radius: 50%; border: 0; background: #f3d6d6; color: #a00; font-size: 18px; line-height: 30px; padding: 0; }
  .qta { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .qta span { flex: 1; color: #555; font-size: 15px; }
  .qta button { width: 46px; height: 46px; border-radius: 12px; border: 1px solid #bbb; background: #eee; font-size: 24px; color: #222; padding: 0; }
  .qta input { width: 96px; text-align: center; font-size: 24px; font-weight: 700; padding: 8px; }
  #aggiungi { width: 100%; padding: 14px; font-size: 18px; font-weight: 700; border: 2px dashed #c9a800; border-radius: 14px; background: #fffbe6; color: #8a6d00; }
  #pr { font-size: 22px; }
  #riepilogo { text-align: center; color: #555; min-height: 1.4em; margin: 10px 0; }
  #invia { width: 100%; height: 62px; font-size: 22px; font-weight: 700; border: 0; border-radius: 12px; background: #ffd700; color: #222; margin-top: 6px; }
  #invia:disabled { opacity: .45; }
  #esito { text-align: center; margin-top: 12px; min-height: 1.4em; font-weight: 600; }
  .ok { color: #087a08; } .err { color: #b00000; } .attesa { color: #555; }
  h2 { font-size: 17px; margin: 26px 0 8px; color: #555; }
  .storico { list-style: none; padding: 0; margin: 0; font-size: 15px; }
  .storico li { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 8px 12px; margin-bottom: 6px; }
  .storico small { color: #777; }
  footer { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px calc(8px + env(safe-area-inset-bottom)); border-top: 1px solid #e3d9a8; font-size: 13px; color: #666; background: #fff5c8; }
  .led { display: inline-flex; align-items: center; gap: 5px; margin-left: 12px; font-weight: 700; font-size: 12px; }
  .led i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; box-shadow: inset -1px -1px 1px rgba(255,255,255,.5), inset 1px 1px 2px rgba(0,0,0,.6); }
  #tx i { background: #0b4a0b; } #tx.on i { background: radial-gradient(#b4ffb4, #00aa00); }
  #rx i { background: #5a4b00; } #rx.on i { background: radial-gradient(#ffff96, #e6b400); }
  #installa { display: none; margin: 8px 16px 0; padding: 12px 14px; background: #fff; border: 2px solid #ffd700; border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  #installa b { display: block; font-size: 17px; }
  #installa p { margin: 4px 0 10px; color: #555; font-size: 15px; }
  #installa .bottoni { display: flex; gap: 8px; }
  #installa button { flex: 1; padding: 11px; font-size: 16px; border-radius: 10px; border: 0; }
  #btnInstalla { background: #ffd700; font-weight: 700; color: #222; }
  #btnDopo { background: #eee; color: #444; }
  #installa .ios { font-size: 15px; color: #333; }
  #installa .ios svg { vertical-align: -3px; }
  #nonconfig { display: none; padding: 40px 24px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1 id="titolo">BonnyUtilsPhone</h1>
  <p id="sottotitolo">Nuovo ordine</p>
</header>

<div id="installa">
  <b>📲 Installa BonnyUtilsPhone</b>
  <p id="installaTesto">Mettila tra le app: si apre con un tocco, anche senza Chrome.</p>
  <div class="bottoni" id="installaBottoni">
    <button type="button" id="btnInstalla">Installa</button>
    <button type="button" id="btnDopo">Più tardi</button>
  </div>
</div>

<div id="nonconfig">
  <p><b>App non configurata.</b></p>
  <p>Apri il link personale che ti abbiamo mandato su WhatsApp.</p>
</div>

<main id="modulo">
  <div class="riga">
    <div><label for="co">Comm.</label><input id="co" maxlength="10" autocapitalize="characters" autocomplete="off"></div>
    <div><label for="ar">Articolo</label><input id="ar" maxlength="10" autocapitalize="characters" autocomplete="off"></div>
    <div><label for="ct">Cotta</label><input id="ct" maxlength="10" autocapitalize="characters" autocomplete="off"></div>
  </div>

  <div class="sezione"><label>Taglie e capi</label><span id="totCapi"></span></div>
  <div id="righe"></div>
  <button id="aggiungi" type="button">＋ Aggiungi taglia</button>

  <label for="pr">Prezzo a maglia € <small style="font-weight:400;color:#777">(facoltativo, uguale per tutte le taglie)</small></label>
  <input id="pr" inputmode="decimal" placeholder="es. 1,20">

  <label for="note">Note <small style="font-weight:400;color:#777">(facoltative)</small></label>
  <textarea id="note" rows="2" maxlength="300"></textarea>

  <div id="riepilogo"></div>
  <button id="invia" type="button">INVIA ORDINE</button>
  <div id="esito"></div>

  <h2 id="titoloStorico" hidden>Ordini inviati da questo telefono</h2>
  <ul class="storico" id="storico"></ul>
</main>

<footer>
  <span id="versione">BonnyUtilsPhone</span>
  <span><span class="led" id="tx"><i></i>TX</span><span class="led" id="rx"><i></i>RX</span></span>
</footer>

<script>
'use strict';
const VERSIONE = '1.2';
const TAGLIE = ['XS', 'S', 'M', 'L', 'XL', 'XXL', 'XXXL', 'Taglia unica'];
const CORTO = { 'Taglia unica': 'Unica' };
const $ = id => document.getElementById(id);
$('versione').textContent = 'BonnyUtilsPhone v' + VERSIONE;

// ---------------------------------------------------------------- configurazione
// Il link personale contiene dopo il "#": c = numero cliente, n = nome, k = chiave,
// t = token del bot dei clienti, ch = canale ordini. La parte dopo "#" non arriva mai al server.
function leggiConfig() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('c') && h.get('k') && h.get('t') && h.get('ch')) {
    const cfg = { c: h.get('c'), n: h.get('n') || '', k: h.get('k'), t: h.get('t'), ch: h.get('ch') };
    try { localStorage.setItem('cfg', JSON.stringify(cfg)); } catch (e) {}
    return cfg;
  }
  try { return JSON.parse(localStorage.getItem('cfg') || 'null'); } catch (e) { return null; }
}
const cfg = leggiConfig();
if (!cfg) {
  $('modulo').style.display = 'none';
  $('nonconfig').style.display = 'block';
} else {
  $('titolo').textContent = cfg.n || 'BonnyUtilsPhone';
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

// ---------------------------------------------------------------- installazione
// Chrome/Edge (Android e PC): la richiesta vera di installazione, con il nostro pulsante.
// iPhone/iPad (Safari): non esiste la richiesta automatica, quindi spieghiamo i due tocchi da fare.
(function () {
  const installata = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  if (installata || !cfg) return;
  let rimandata = 0;
  try { rimandata = Number(localStorage.getItem('installaDopo') || 0); } catch (e) {}
  if (Date.now() - rimandata < 3 * 24 * 3600 * 1000) return; // "Più tardi": richiede dopo 3 giorni
  const box = $('installa');
  $('btnDopo').onclick = () => {
    box.style.display = 'none';
    try { localStorage.setItem('installaDopo', String(Date.now())); } catch (e) {}
  };
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (ios) {
    const safari = !/crios|fxios|edgios/i.test(navigator.userAgent);
    $('installaTesto').innerHTML = safari
      ? '<span class="ios">Tocca <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0a84ff" stroke-width="2"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 12v8h14v-8"/></svg> <b style="display:inline">Condividi</b> qui sotto, poi <b style="display:inline">«Aggiungi alla schermata Home»</b>.</span>'
      : '<span class="ios">Apri questo link con <b style="display:inline">Safari</b> per poterla aggiungere alla schermata Home.</span>';
    $('btnInstalla').style.display = 'none';
    $('btnDopo').textContent = 'Ok, più tardi';
    box.style.display = 'block';
    return;
  }
  let richiesta = null;
  addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    richiesta = e;
    box.style.display = 'block';
  });
  $('btnInstalla').onclick = async () => {
    if (!richiesta) return;
    richiesta.prompt();
    const scelta = await richiesta.userChoice;
    richiesta = null;
    box.style.display = 'none';
    if (scelta.outcome !== 'accepted') { try { localStorage.setItem('installaDopo', String(Date.now())); } catch (e) {} }
  };
  addEventListener('appinstalled', () => { box.style.display = 'none'; });
})();

// ---------------------------------------------------------------- spie TX / RX
function lampo(id) {
  const el = $(id);
  el.classList.add('on');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('on'), 220);
}

// ---------------------------------------------------------------- modulo
// Ogni riga è una taglia con il suo numero di capi. Commessa, articolo, cotta e prezzo valgono per tutte.
let righe = [];

function nuovaRiga(fuoco) {
  const usate = righe.map(r => r.tg);
  const ultima = righe.length ? TAGLIE.indexOf(righe[righe.length - 1].tg) : -1;
  // propone la taglia successiva all'ultima, se libera
  let tg = '';
  if (righe.length && ultima >= 0) {
    for (let i = ultima + 1; i < TAGLIE.length - 1; i++) if (!usate.includes(TAGLIE[i])) { tg = TAGLIE[i]; break; }
  }
  righe.push({ tg, capi: '' });
  disegnaRighe(fuoco === false ? -1 : righe.length - 1);
}

function disegnaRighe(fuoco) {
  const box = $('righe');
  box.innerHTML = '';
  righe.forEach((r, i) => {
    const el = document.createElement('div');
    el.className = 'rigat' + (i === fuoco ? ' nuova' : '');
    const chips = document.createElement('div');
    chips.className = 'chips';
    for (const t of TAGLIE) {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = CORTO[t] || t;
      b.className = r.tg === t ? 'on' : '';
      b.disabled = r.tg !== t && righe.some((x, j) => j !== i && x.tg === t);
      b.onclick = () => { r.tg = r.tg === t ? '' : t; disegnaRighe(); };
      chips.appendChild(b);
    }
    el.appendChild(chips);
    if (righe.length > 1) {
      const del = document.createElement('button');
      del.type = 'button'; del.className = 'del'; del.textContent = '×'; del.title = 'Togli';
      del.onclick = () => { righe.splice(i, 1); disegnaRighe(); };
      el.appendChild(del);
    }
    const q = document.createElement('div');
    q.className = 'qta';
    const lbl = document.createElement('span');
    lbl.textContent = 'Capi' + (r.tg ? ' taglia ' + r.tg : '');
    const meno = document.createElement('button'); meno.type = 'button'; meno.textContent = '−';
    const piu = document.createElement('button'); piu.type = 'button'; piu.textContent = '+';
    const inp = document.createElement('input');
    inp.type = 'number'; inp.inputMode = 'numeric'; inp.min = 1; inp.max = 99999; inp.placeholder = '0';
    inp.value = r.capi;
    inp.oninput = () => { r.capi = inp.value; aggiorna(); };
    meno.onclick = () => { r.capi = String(Math.max(1, (parseInt(r.capi, 10) || 1) - 1)); inp.value = r.capi; aggiorna(); };
    piu.onclick = () => { r.capi = String(Math.min(99999, (parseInt(r.capi, 10) || 0) + 1)); inp.value = r.capi; aggiorna(); };
    q.append(lbl, meno, inp, piu);
    el.appendChild(q);
    box.appendChild(el);
    if (i === fuoco) setTimeout(() => inp.focus(), 50);
  });
  aggiorna();
}
$('aggiungi').onclick = () => nuovaRiga(true);

function righeValide() {
  const ok = righe.filter(r => parseInt(r.capi, 10) > 0);
  return ok.map(r => ({ tg: r.tg, capi: parseInt(r.capi, 10) }));
}

function prezzo() {
  const t = $('pr').value.trim().replace('€', '').replace(',', '.');
  if (!t) return '';
  const p = Number(t);
  return isFinite(p) && p >= 0 && p < 100000 ? p.toFixed(2) : null;
}

let inInvio = false;
function fogliDi(n) { return Math.floor(n / 25) + (n % 25 ? 1 : 0); }
function aggiorna() {
  const valide = righeValide();
  const n = valide.reduce((a, r) => a + r.capi, 0);
  const fogli = valide.reduce((a, r) => a + fogliDi(r.capi), 0);
  // con più taglie ognuna deve avere la sua taglia, tutte diverse
  const piu = righe.length > 1;
  let problema = '';
  righe.forEach((r, i) => {
    const el = $('righe').children[i];
    const male = piu && (!r.tg || !(parseInt(r.capi, 10) > 0));
    if (el) el.classList.toggle('errore', male);
    if (male && !problema) problema = !r.tg ? 'Scegli la taglia in ogni riga' : 'Metti i capi in ogni riga';
  });
  $('totCapi').textContent = n > 0 ? n + ' capi' : '';
  if (n > 0) {
    let s = (valide.length > 1 ? valide.length + ' taglie · ' : '') + n + ' capi · ' + fogli + (fogli === 1 ? ' foglio' : ' fogli');
    const p = prezzo();
    if (p) s += ' · Totale ' + (n * Number(p)).toLocaleString('it-IT', { style: 'currency', currency: 'EUR' });
    $('riepilogo').textContent = problema || s;
  } else {
    $('riepilogo').textContent = problema;
  }
  $('riepilogo').style.color = problema ? '#b00000' : '';
  const pronto = $('co').value.trim() && $('ar').value.trim() && $('ct').value.trim() && n > 0 && n <= 99999 && !problema && prezzo() !== null;
  $('invia').disabled = !pronto || inInvio;
}
for (const id of ['co', 'ar', 'ct', 'pr', 'note']) $(id).addEventListener('input', aggiorna);

function testoTaglie(rr) {
  return rr.map(r => (r.tg || 'senza taglia') + ' × ' + r.capi).join(', ');
}

// ---------------------------------------------------------------- cifratura (AES-256-CBC + HMAC-SHA256)
function b64url(buf) {
  let s = '';
  for (const b of new Uint8Array(buf)) s += String.fromCharCode(b);
  return btoa(s).replace(/=+$/, '').replace(/\+/g, '-').replace(/\//g, '_');
}
function daB64url(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  return Uint8Array.from(atob(s), c => c.charCodeAt(0));
}
async function cifra(testo) {
  const chiave = daB64url(cfg.k);
  const kAes = await crypto.subtle.importKey('raw', chiave.slice(0, 32), 'AES-CBC', false, ['encrypt']);
  const kMac = await crypto.subtle.importKey('raw', chiave.slice(32, 64), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  const iv = crypto.getRandomValues(new Uint8Array(16));
  const ct = await crypto.subtle.encrypt({ name: 'AES-CBC', iv }, kAes, new TextEncoder().encode(testo));
  const ivS = b64url(iv), ctS = b64url(ct);
  const firma = await crypto.subtle.sign('HMAC', kMac, new TextEncoder().encode(cfg.c + '.' + ivS + '.' + ctS));
  return '#ORD ' + cfg.c + ' ' + ivS + '.' + ctS + '.' + b64url(firma);
}

// ---------------------------------------------------------------- invio
async function invia() {
  if (inInvio) return;
  const rr = righeValide();
  const n = rr.reduce((a, r) => a + r.capi, 0);
  const ordine = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
    co: $('co').value.trim(), ar: $('ar').value.trim(), ct: $('ct').value.trim(),
    righe: rr, tg: rr.length === 1 ? rr[0].tg : '', capi: n,
    pr: prezzo() || '', note: $('note').value.trim(), ts: new Date().toISOString()
  };
  if (!confirm('Inviare l\'ordine?\n\nComm. ' + ordine.co + ' · Art. ' + ordine.ar + ' · Cotta ' + ordine.ct +
      '\n' + testoTaglie(rr) + '\nTotale ' + n + ' capi' + (ordine.pr ? ' · € ' + ordine.pr.replace('.', ',') + ' a maglia' : ''))) return;

  inInvio = true; aggiorna();
  $('esito').className = 'attesa';
  $('esito').textContent = 'Invio in corso...';
  try {
    const testo = await cifra(JSON.stringify(ordine));
    const corpo = new URLSearchParams({ chat_id: cfg.ch, text: testo });
    const url = 'https://api.telegram.org/bot' + cfg.t + '/sendMessage';
    let confermato = false;
    lampo('tx');
    try {
      const r = await fetch(url, { method: 'POST', body: corpo });
      lampo('rx');
      const j = await r.json();
      if (!j.ok) throw new Error(j.description || 'errore');
      confermato = true;
    } catch (e) {
      if (e instanceof TypeError) {
        // Il browser non ha potuto leggere la risposta: rimando senza leggerla
        // (se arriva due volte, il PC scarta il doppione).
        lampo('tx');
        await fetch(url, { method: 'POST', body: corpo, mode: 'no-cors' });
      } else {
        throw e;
      }
    }
    salvaStorico(ordine);
    $('esito').className = 'ok';
    $('esito').textContent = confermato ? '✅ Ordine inviato!' : '✅ Ordine inviato';
    for (const id of ['co', 'ar', 'ct', 'pr', 'note']) $(id).value = '';
    righe = [];
    nuovaRiga(false);
  } catch (e) {
    $('esito').className = 'err';
    $('esito').textContent = '❌ Ordine non inviato: ' + (navigator.onLine === false ? 'nessuna connessione' : e.message) + '. Riprova.';
  } finally {
    inInvio = false; aggiorna();
  }
}
$('invia').addEventListener('click', invia);

// ---------------------------------------------------------------- storico locale
function leggiStorico() {
  try { return JSON.parse(localStorage.getItem('storico') || '[]'); } catch (e) { return []; }
}
function salvaStorico(o) {
  const s = leggiStorico();
  s.unshift(o);
  try { localStorage.setItem('storico', JSON.stringify(s.slice(0, 30))); } catch (e) {}
  mostraStorico();
}
function mostraStorico() {
  const s = leggiStorico();
  $('titoloStorico').hidden = s.length === 0;
  const ul = $('storico');
  ul.innerHTML = '';
  for (const o of s) {
    const li = document.createElement('li');
    const d = new Date(o.ts);
    li.textContent = 'Comm. ' + o.co + ' · Art. ' + o.ar + ' · ' + (o.righe ? testoTaglie(o.righe) : (o.tg || '-')) + ' · ' + o.capi + ' capi' +
      (o.pr ? ' · € ' + String(o.pr).replace('.', ',') : '');
    const small = document.createElement('small');
    small.textContent = '  ' + d.toLocaleDateString('it-IT') + ' ' + d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
    li.appendChild(document.createElement('br'));
    li.appendChild(small);
    ul.appendChild(li);
  }
}
mostraStorico();
nuovaRiga(false);
</script>
</body>
</html>
